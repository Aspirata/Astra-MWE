name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux GUI dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Core tests
        run: go test ./internal/...
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm test
      - name: Build Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture ${{ matrix.arch }}
      - name: Build Linux
        if: matrix.os == 'linux'
        run: bash scripts/build-linux.sh ${{ matrix.arch }}
      - name: Package release
        run: go run ./cmd/package-release -os ${{ matrix.os }} -arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: astra-mwe-${{ matrix.os }}-${{ matrix.arch }}
          path: build/releases/*
